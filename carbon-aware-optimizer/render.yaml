services:
  - type: web
    name: carbon-aware-optimizer-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        value: sqlite:////tmp/carbon_optimizer.db
      - key: FRONTEND_ORIGINS
        fromService:
          type: static
          name: carbon-aware-optimizer-ui
          property: host

  - type: static
    name: carbon-aware-optimizer-ui
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: carbon-aware-optimizer-api
          property: host
